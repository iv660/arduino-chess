[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Library dependencies
lib_deps = 
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    gissio/mcu-max @ ^1.0.0

; Build flags
build_flags = 
    -D MONITOR_SPEED=115200

[env:native]
platform = native
test_build_src = true
build_src_filter = -<*> +<GameState.cpp>
lib_extra_dirs = .pio/libdeps/native
lib_ldf_mode = deep+
lib_compat_mode = off
lib_deps =
    gissio/mcu-max @ ^1.0.0
build_flags = 
    -std=c++11
    -D UNIT_TEST
    -I src
    -I .pio/libdeps/native/mcu-max/src
