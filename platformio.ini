[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Library dependencies
lib_deps = 
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    gissio/mcu-max @ ^1.0.0

; Build flags
build_flags = 
    -D MONITOR_SPEED=115200
